<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#f0f1e9" />
    <title>Lake District · Transport map</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <main class="board">
      <header class="mast">
        <div>
          <h1>Lake District</h1>
          <p>Buses &amp; Lakes Line trains</p>
        </div>
        <div class="mast-tools">
          <span class="mode-switch" role="group" aria-label="Data mode"
            ><button id="live" aria-pressed="true">Live</button
            ><button id="replay" aria-pressed="false">Replay</button></span
          >
          <button class="theme icon" id="theme" aria-label="Use dark theme" title="Use dark theme">
            ☾
          </button>
        </div>
      </header>
      <section class="map-panel" aria-label="Lake District transport map">
        <svg
          id="map"
          viewBox="0 0 480 748"
          aria-label="Geographic map of Stagecoach bus routes and the Lakes Line"
        ></svg>
        <div class="map-tools">
          <button class="icon" id="plus" title="Zoom in" aria-label="Zoom in">+</button
          ><button class="icon" id="minus" title="Zoom out" aria-label="Zoom out">−</button
          ><button class="icon" id="reset" title="Show full area" aria-label="Show full area">⛶</button>
        </div>
        <div class="north" aria-label="North up"><i></i>N</div>
        <div class="map-foot">
          <span id="scale"></span>
          <details id="credits">
            <summary>Map credits</summary>
            <div>
              © <a href="https://www.openstreetmap.org/copyright">OpenStreetMap contributors</a> ·
              <a href="https://openfreemap.org/">OpenFreeMap</a> ·
              <a href="https://openmaptiles.org/">OpenMapTiles</a><br />Terrain ©
              <a href="https://github.com/tilezen/joerd/blob/master/docs/attribution.md"
                >Mapzen and sources</a
              >
              · Routes © <a href="https://www.stagecoachbus.com/open-data">Stagecoach</a>
            </div>
          </details>
        </div>
        <div id="vehicle" hidden role="region" aria-label="Vehicle details">
          <button id="close" class="close" aria-label="Close vehicle details">×</button>
          <div id="vehicle-info"></div>
        </div>
      </section>
      <aside>
        <div class="side-heading">
          <h2>Routes</h2>
          <button id="show-all" hidden>Show all</button>
        </div>
        <div id="routes" aria-label="Focus on a route"></div>
        <section class="reports">
          <h2>Running information</h2>
          <div><span>Bus GPS</span><b id="bus-status">Connecting…</b></div>
          <div><span>Rail estimates</span><b id="rail-status">Connecting…</b></div>
          <small id="observed"></small>
        </section>
        <div id="playback" hidden>
          <label for="frame">Recorded fixes</label>
          <div>
            <button id="play" aria-label="Pause replay">Pause</button
            ><input type="range" id="frame" min="0" value="0" aria-label="Recorded snapshot" />
          </div>
          <output id="record-time"></output>
        </div>
        <details class="list">
          <summary>Vehicles on map <span id="count"></span></summary>
          <div id="vehicles"></div>
        </details>
        <div id="status" role="status"></div>
      </aside>
    </main>
    <script type="module" src="/app.mjs"></script>
  </body>
</html>
