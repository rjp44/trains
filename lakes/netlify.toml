[build]
  command = "node build-pwa.mjs"
  publish = "dist"
  functions = "functions"

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[redirects]]
  from = "/api/rail-reports"
  to = "https://api.railinfo.uk/map/trains"
  status = 200
